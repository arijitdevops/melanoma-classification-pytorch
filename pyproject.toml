[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melanoma-classification-pytorch"
version = "0.1.0"
description = "Transfer-learning pipeline for benign vs. malignant skin-lesion image classification (research demo, not a medical device)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sample Projects" }]
keywords = ["pytorch", "transfer-learning", "medical-imaging", "image-classification", "grad-cam"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "numpy>=1.24,<3",
    "pillow>=10.0,<13",
    "matplotlib>=3.7,<4",
    "scikit-learn>=1.3,<2",
    "pandas>=2.0,<4",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "tqdm>=4.66,<5",
    "tensorboard>=2.14,<3",
    "flask>=3.0,<4",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
onnx = ["onnx>=1.15,<2", "onnxruntime>=1.17,<2", "onnxscript>=0.3"]
dev = ["pytest>=7.4,<10", "ruff>=0.4,<1"]

[project.scripts]
melanoma-train = "src.train:main"
melanoma-evaluate = "src.evaluate:main"
melanoma-predict = "src.predict:main"

[tool.setuptools]
packages = ["src", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
