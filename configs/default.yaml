# Default configuration for melanoma-classification-pytorch.
# Every value here can be overridden by an environment variable (see README) or a CLI flag.

data:
  # Dataset root. Must contain train/{Benign,Malignant} and test/{Benign,Malignant}.
  data_dir: ../_datasets/melanoma_skin_cancer
  # Fraction of the training folder held out for validation (stratified).
  val_split: 0.15
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true

model:
  name: resnet50
  pretrained: true
  freeze_backbone: false
  num_classes: 2
  dropout: 0.2

train:
  epochs: 15
  lr: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 1
  min_lr: 0.000001
  label_smoothing: 0.05
  grad_clip: 1.0
  amp: true
  balance: weights          # one of: sampler, weights, none
  early_stopping_patience: 5
  checkpoint_dir: checkpoints
  log_dir: runs

eval:
  # Minimum recall on the Malignant class used when picking a high-sensitivity threshold.
  target_sensitivity: 0.95
  reports_dir: reports
  figures_dir: reports/figures

seed: 42
device: auto
